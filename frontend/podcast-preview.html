<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Episode - Systems & Reality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #090a0f;
      --bg-card: #12151e;
      --bg-card-hover: #1b202e;
      --border-color: #2a2e3d;
      --border-highlight: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background-color: #030407;
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .podcast-player-container {
      background-color: var(--bg-void);
      color: var(--text-primary);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 960px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .player-header {
      margin-bottom: 1.5rem;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      margin-bottom: 0.5rem;
    }

    .sys-tag {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .status-indicator {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background-color: #1e293b;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .status-indicator.active {
      background-color: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .episode-title {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 0.5rem 0;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .episode-thesis {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0;
    }

    .controls-waveform-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .primary-controls {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .play-pause-btn {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .play-pause-btn:hover {
      transform: scale(1.05);
      background-color: #2563eb;
    }

    .play-pause-btn svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: currentColor;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      display: flex;
      gap: 0.35rem;
      color: var(--text-secondary);
    }

    .current-time {
      color: var(--text-primary);
      font-weight: 600;
    }

    .waveform-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
    }

    .waveform-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 60px;
      padding: 4px 0;
    }

    .wave-bar {
      flex: 1;
      background-color: #262c3d;
      border: none;
      padding: 0;
      margin: 0;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      min-width: 2px;
    }

    .wave-bar:hover {
      background-color: #475569;
    }

    .wave-bar.passed {
      background-color: var(--accent-blue);
    }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background-color: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent-blue);
      transition: width 0.1s linear;
      width: 0%;
    }

    .timecodes-section {
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--accent-blue);
      margin-bottom: 1rem;
    }

    .section-title h2 {
      font-size: 0.875rem;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
      letter-spacing: 0.05em;
    }

    .timecodes-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .timecode-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.875rem 1rem;
      text-align: left;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      width: 100%;
    }

    .timecode-card:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--text-muted);
    }

    .timecode-card.active {
      border-color: var(--accent-blue);
      background-color: rgba(59, 130, 246, 0.08);
    }

    .tc-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .tc-time {
      font-family: var(--font-mono);
      color: var(--accent-blue);
      font-weight: 600;
      font-size: 0.875rem;
      flex-shrink: 0;
    }

    .tc-title {
      font-weight: 600;
    }

    .tc-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.4;
      padding-left: 4.25rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      .podcast-player-container {
        padding: 1rem;
      }
      .episode-title {
        font-size: 1.35rem;
      }
      .waveform-bars {
        height: 44px;
        gap: 2px;
      }
      .tc-desc {
        padding-left: 0;
        margin-top: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="podcast-player-container" id="podcast-player-main" data-testid="podcast-player">
    <audio id="audio-element" preload="metadata"></audio>

    <!-- Episode Header -->
    <header class="player-header" id="header">
      <div class="header-badge">
        <span class="sys-tag">[EP_01]</span>
        <span class="status-indicator" id="status-indicator">READY</span>
      </div>
      <h1 class="episode-title">Системы и реальность: Выпуск 1</h1>
      <p class="episode-thesis">Дискуссия о системном мышлении, поиске узких мест и техническом брутализме.</p>
    </header>

    <!-- Player Controls & Waveform Section -->
    <section class="controls-waveform-section" id="player-controls">
      <div class="primary-controls">
        <button
          class="play-pause-btn"
          id="play-pause-btn"
          aria-label="Play episode"
          data-testid="play-pause-button"
        >
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
        </button>

        <div class="time-display" data-testid="time-display">
          <span class="current-time" id="current-time-display">00:00</span>
          <span class="divider">/</span>
          <span class="total-duration" id="total-duration-display">30:00</span>
        </div>
      </div>

      <!-- Waveform Visualization -->
      <div
        class="waveform-wrapper"
        id="waveform"
        data-testid="waveform-container"
        role="region"
        aria-label="Audio Waveform Visualization"
      >
        <div class="waveform-bars" id="waveform-bars"></div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- Timecodes List -->
    <section class="timecodes-section" id="timecodes-list" data-testid="timecodes-section">
      <div class="section-title">
        <span class="sys-icon">►</span>
        <h2>TIMECODES & TOPICS</h2>
      </div>
      <div class="timecodes-grid" id="timecodes-grid"></div>
    </section>
  </div>

  <script>
    const episodeData = {
      durationSeconds: 1800,
      timecodes: [
        { id: 1, timeOffsetSeconds: 0, title: 'Введение и концепция системы', description: 'Основные тезисы и манифест.' },
        { id: 2, timeOffsetSeconds: 180, title: 'Теория ограничений и узкие места', description: 'Поиск главных блокеров в архитектуре.' },
        { id: 3, timeOffsetSeconds: 540, title: 'Деонтическая чистота и автономность', description: 'Как строить саморегулируемые процессы.' },
        { id: 4, timeOffsetSeconds: 1100, title: 'Практика и выводы', description: 'Заключительные мысли и вопросы.' }
      ],
      waveHeights: [
        25, 40, 60, 30, 80, 95, 70, 50, 85, 60,
        40, 75, 90, 55, 35, 65, 80, 45, 90, 100,
        70, 40, 60, 85, 50, 30, 75, 90, 65, 45,
        80, 60, 35, 70, 95, 50, 40, 85, 75, 60
      ]
    };

    let isPlaying = false;
    let currentTime = 0;
    let duration = episodeData.durationSeconds;

    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const statusIndicator = document.getElementById('status-indicator');
    const currentTimeDisplay = document.getElementById('current-time-display');
    const totalDurationDisplay = document.getElementById('total-duration-display');
    const waveformBarsContainer = document.getElementById('waveform-bars');
    const progressFill = document.getElementById('progress-fill');
    const timecodesGrid = document.getElementById('timecodes-grid');

    function formatTime(secs) {
      if (isNaN(secs) || secs == null) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderWaveform() {
      waveformBarsContainer.innerHTML = '';
      episodeData.waveHeights.forEach((height, index) => {
        const bar = document.createElement('button');
        bar.type = 'button';
        bar.className = 'wave-bar';
        bar.style.height = height + '%';
        bar.dataset.testid = 'wave-bar-' + index;
        bar.setAttribute('aria-label', `Seek to ${formatTime((index / episodeData.waveHeights.length) * duration)}`);
        bar.addEventListener('click', () => {
          const targetTime = Math.round((index / episodeData.waveHeights.length) * duration);
          seekTo(targetTime);
        });
        waveformBarsContainer.appendChild(bar);
      });
    }

    function renderTimecodes() {
      timecodesGrid.innerHTML = '';
      episodeData.timecodes.forEach((tc, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'timecode-card';
        card.dataset.testid = 'timecode-item-' + tc.id;
        card.dataset.timestamp = tc.timeOffsetSeconds;
        card.addEventListener('click', () => {
          seekTo(tc.timeOffsetSeconds);
        });

        card.innerHTML = `
          <div class="tc-header">
            <span class="tc-time">[${formatTime(tc.timeOffsetSeconds)}]</span>
            <span class="tc-title">${tc.title}</span>
          </div>
          ${tc.description ? `<p class="tc-desc">${tc.description}</p>` : ''}
        `;
        timecodesGrid.appendChild(card);
      });
    }

    function seekTo(seconds) {
      currentTime = Math.max(0, Math.min(seconds, duration));
      updateUI();
    }

    function updateUI() {
      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      currentTimeDisplay.textContent = formatTime(currentTime);
      totalDurationDisplay.textContent = formatTime(duration);
      progressFill.style.width = progressPercent + '%';

      // Update Play/Pause UI
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        statusIndicator.textContent = 'PLAYING';
        statusIndicator.classList.add('active');
        playPauseBtn.setAttribute('aria-label', 'Pause episode');
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        statusIndicator.textContent = 'READY';
        statusIndicator.classList.remove('active');
        playPauseBtn.setAttribute('aria-label', 'Play episode');
      }

      // Update wave bars passed state
      const bars = waveformBarsContainer.querySelectorAll('.wave-bar');
      bars.forEach((bar, index) => {
        const barPercent = (index / episodeData.waveHeights.length) * 100;
        if (barPercent <= progressPercent) {
          bar.classList.add('passed');
        } else {
          bar.classList.remove('passed');
        }
      });

      // Update timecode active states
      const tcCards = timecodesGrid.querySelectorAll('.timecode-card');
      episodeData.timecodes.forEach((tc, i) => {
        const nextTime = (i < episodeData.timecodes.length - 1) ? episodeData.timecodes[i + 1].timeOffsetSeconds : Infinity;
        const isActive = currentTime >= tc.timeOffsetSeconds && currentTime < nextTime;
        if (tcCards[i]) {
          if (isActive) {
            tcCards[i].classList.add('active');
          } else {
            tcCards[i].classList.remove('active');
          }
        }
      });
    }

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      updateUI();
    });

    renderWaveform();
    renderTimecodes();
    updateUI();
  </script>
</body>
</html>
