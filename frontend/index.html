<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дмитрий Ефремов — Системы, логика мышления и автономные процессы</title>
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Typography: Geist, Inter & JetBrains Mono for High-Legibility & Zero Ocular Strain -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Geist', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* High-Legibility & Neurophysiological Ergonomics */
      :root {
        --font-sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      html {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        scroll-behavior: smooth;
        font-size: 16px;
      }

      body {
        font-family: var(--font-sans);
        letter-spacing: -0.015em;
        line-height: 1.65;
        background-color: #090a0f;
        color: #e2e8f0;
      }

      /* Eye-friendly non-glaring selection */
      ::selection {
        background: rgba(212, 175, 55, 0.35);
        color: #ffffff;
      }

      /* Architectural typography hierarchy */
      h1, h2, h3, h4 {
        letter-spacing: -0.03em;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      }

      p {
        line-height: 1.7;
      }

      /* Precision hairline dividers */
      hr, .border-hairline {
        border-color: rgba(255, 255, 255, 0.08);
      }

      /* Smooth custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
      }
    </style>
  </head>
  <body class="bg-[#090a0f] text-[#e2e8f0]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
