name: Automated Backup Verification

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backup-restore-verification:
    name: Verify Database Backup and Restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Backup & Restore Verification Suite
        run: bash ./scripts/test_backup_restore.sh
