spring.application.name=dmitryefremov-site
server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

telegram.webhook.secret-token=${TELEGRAM_WEBHOOK_SECRET_TOKEN:default_telegram_secret_token}
app.encryption.key=${APP_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
