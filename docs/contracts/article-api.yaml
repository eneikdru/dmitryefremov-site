openapi: 3.0.3
info:
  title: Article API Contract
  description: Shared API specification for Dmitry Efremov's Thought Stream articles. Defines endpoints for retrieving articles, article lists, and individual raw Markdown content.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/articles:
    get:
      summary: List articles
      description: Retrieves a paginated list of published articles in the Thought Stream, ordered by publication date descending.
      operationId: listArticles
      parameters:
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved article list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/articles/{slug}:
    get:
      summary: Get article by slug
      description: Retrieves a single article including its raw Markdown body content and publication date.
      operationId: getArticleBySlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Unique URL identifier slug of the article
          schema:
            type: string
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Article:
      type: object
      required:
        - id
        - slug
        - title
        - content
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        slug:
          type: string
          description: Unique URL-friendly slug of the article
          example: "deontic-logic-and-autonomous-systems"
        title:
          type: string
          description: Title of the article
          example: "Deontic Logic in Autonomous Systems"
        summary:
          type: string
          nullable: true
          description: Short summary or excerpt of the article
          example: "An analysis of deontic operators O, P, F in system design."
        content:
          type: string
          description: Raw Markdown body of the article
          example: "# Deontic Logic\n\nYour code and your decisions are who you truly are."
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the article was published
          example: "2026-10-09T10:00:00Z"
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
          example: "2026-10-09T11:58:17Z"

    ArticlePage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: "Article with slug 'unknown-slug' was not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T12:00:00Z"
