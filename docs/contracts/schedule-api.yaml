openapi: 3.0.3
info:
  title: Schedule API Contract
  description: Shared API specification for Dmitry Efremov's Publication Schedule. Defines endpoints for retrieving planned release timeline data.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/schedule:
    get:
      summary: List publication schedule entries
      description: Retrieves a list of scheduled content releases, optionally filtered by target platform.
      operationId: listSchedules
      parameters:
        - name: platform
          in: query
          description: Target platform filter (e.g., TELEGRAM, YOUTUBE, ARTICLE)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved publication schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicationSchedule'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PublicationSchedule:
      type: object
      required:
        - id
        - title
        - platform
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          description: Title of the scheduled release
          example: "Деонтическая логика в микросервисах"
        platform:
          type: string
          description: Target distribution platform
          example: "TELEGRAM"
        status:
          type: string
          description: Current lifecycle status of the entry (SCHEDULED, IN_PRODUCTION, PUBLISHED)
          example: "SCHEDULED"
        topicSummary:
          type: string
          nullable: true
          description: Detailed topic summary or thesis outline
          example: "Заметка про модальные операторы нормативных систем в Telegram @efremov_mvp"
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Expected target date/time for publication
          example: "2026-10-15T18:00:00Z"
        createdAt:
          type: string
          format: date-time
          description: Entry creation timestamp
          example: "2026-10-09T11:58:24Z"

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid platform filter"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T12:00:00Z"
