openapi: 3.0.3
info:
  title: Direct Contact Submission API Contract
  description: Shared API specification for Dmitry Efremov's direct contact form submission and query system. Defines endpoints and schemas for direct messages from site visitors and clients.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/contact:
    post:
      summary: Submit a contact message
      description: Submits a direct contact message or inquiry to Dmitry Efremov. Validates payload fields, saves message, and dispatches an email acknowledgement.
      operationId: submitContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSubmissionRequest'
      responses:
        '201':
          description: Contact message submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResponse'
        '400':
          description: Invalid request payload or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity due to business rule validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Query contact messages status and history
      description: Retrieves a paginated list of contact messages (filtered by sender email or processing status).
      operationId: listContactMessages
      parameters:
        - name: senderEmail
          in: query
          description: Filter contact messages by sender email address
          required: false
          schema:
            type: string
            format: email
        - name: status
          in: query
          description: Filter contact messages by status
          required: false
          schema:
            $ref: '#/components/schemas/ContactStatus'
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved contact messages list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessagePage'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/contact:
    post:
      summary: Direct contact submission alias
      description: Legacy/Direct entry alias endpoint for contact message submissions.
      operationId: submitContactMessageAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSubmissionRequest'
      responses:
        '201':
          description: Contact message submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResponse'
        '400':
          description: Invalid request payload or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/contact/{id}:
    get:
      summary: Get contact message details by ID
      description: Retrieves details of a specific contact message by its unique ID.
      operationId: getContactMessageById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the contact message
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Contact message details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResponse'
        '404':
          description: Contact message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ContactStatus:
      type: string
      enum:
        - NEW
        - IN_REVIEW
        - PROCESSED
        - ARCHIVED
      description: Processing status of the submitted contact message

    ContactSubmissionRequest:
      type: object
      required:
        - senderName
        - senderEmail
        - content
      properties:
        senderName:
          type: string
          minLength: 2
          maxLength: 255
          example: "Alex Mercer"
          description: Full name of the person submitting the contact message
        senderEmail:
          type: string
          format: email
          maxLength: 255
          example: "alex@example.com"
          description: Valid contact email address for receiving responses
        subject:
          type: string
          nullable: true
          maxLength: 255
          example: "Inquiry regarding architectural advisory"
          description: Optional subject line for the message
        content:
          type: string
          minLength: 1
          maxLength: 10000
          example: "Hello Dmitry, I would like to discuss potential collaboration on AI-agent architecture."
          description: Detailed body content of the contact submission

    ContactSubmissionResponse:
      type: object
      required:
        - id
        - senderName
        - senderEmail
        - content
        - status
        - acknowledgementSent
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 42
        senderName:
          type: string
          example: "Alex Mercer"
        senderEmail:
          type: string
          format: email
          example: "alex@example.com"
        subject:
          type: string
          nullable: true
          example: "Inquiry regarding architectural advisory"
        content:
          type: string
          example: "Hello Dmitry, I would like to discuss potential collaboration on AI-agent architecture."
        status:
          $ref: '#/components/schemas/ContactStatus'
        acknowledgementSent:
          type: boolean
          example: true
          description: Indicates whether an email acknowledgement was dispatched
        createdAt:
          type: string
          format: date-time
          example: "2026-10-25T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-25T12:00:00Z"

    ContactMessagePage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContactSubmissionResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "senderEmail"
        message:
          type: string
          example: "must be a well-formed email address"

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Validation failed for contact submission payload"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-25T12:00:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          nullable: true
