openapi: 3.0.3
info:
  title: Client Intake API Contract
  description: Shared API specification for Dmitry Efremov's Client Intake system. Defines the unified intake schema and endpoints for human clients and A2A agentic requests.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/intake:
    post:
      summary: Submit a client intake request
      description: Submits a client intake request for either a human client or an A2A agentic system. Enforces payload validation rules.
      operationId: submitIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientIntakeRequest'
      responses:
        '201':
          description: Intake request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientIntakeResponse'
        '400':
          description: Invalid request payload or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity due to business rule validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Query intake requests status
      description: Retrieves a paginated list of client intake requests (filtered by status or client email if authorized).
      operationId: listIntakes
      parameters:
        - name: clientEmail
          in: query
          description: Filter intake requests by client email address
          required: false
          schema:
            type: string
            format: email
        - name: status
          in: query
          description: Filter intake requests by current processing status
          required: false
          schema:
            $ref: '#/components/schemas/IntakeStatus'
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved intake requests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakePage'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/intake/{intakeId}:
    get:
      summary: Get intake request details by ID
      description: Retrieves details of a specific client intake request by its unique ID.
      operationId: getIntakeById
      parameters:
        - name: intakeId
          in: path
          required: true
          description: Unique numeric identifier of the intake request
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Client intake request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientIntakeResponse'
        '404':
          description: Client intake request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ClientType:
      type: string
      enum:
        - HUMAN
        - AGENT
      description: Discriminator distinguishing human client portal submissions from A2A agentic requests

    IntakeStatus:
      type: string
      enum:
        - NEW
        - IN_REVIEW
        - PROCESSING
        - COMPLETED
        - REJECTED
      description: Lifecycle status of the client intake submission

    AgentMetadata:
      type: object
      description: Supplementary metadata for A2A agentic client requests
      properties:
        agentId:
          type: string
          maxLength: 100
          example: "agent-turnkey-v1"
          description: Unique identifier of the requesting autonomous agent
        agentVersion:
          type: string
          maxLength: 50
          example: "1.0.0"
          description: Software version or build identifier of the agent
        callbackUrl:
          type: string
          format: uri
          nullable: true
          example: "https://agent.example.com/api/callback"
          description: Optional webhook endpoint for async status callbacks
        capabilities:
          type: array
          items:
            type: string
          nullable: true
          example: ["AUDIT", "INTAKE_AUTO_PROCESS"]
          description: List of agent capabilities or features enabled

    ClientIntakeRequest:
      type: object
      required:
        - clientName
        - clientEmail
        - wishlistPayload
      properties:
        clientType:
          $ref: '#/components/schemas/ClientType'
          default: HUMAN
        clientName:
          type: string
          minLength: 2
          maxLength: 255
          example: "Alice Smith"
          description: Name of the client or submitting organization contact
        clientEmail:
          type: string
          format: email
          maxLength: 255
          example: "alice@example.com"
          description: Valid email address for intake updates and communication
        companyName:
          type: string
          nullable: true
          maxLength: 255
          example: "Acme Corp"
          description: Optional company or entity name
        wishlistPayload:
          type: string
          minLength: 10
          maxLength: 10000
          example: "We need a turnkey AI automated pipeline for client intake with encrypted storage."
          description: Detailed project scope, wishlist directives, or audit requirements submitted by human or agentic client
        agentMetadata:
          $ref: '#/components/schemas/AgentMetadata'
          nullable: true
        source:
          type: string
          enum:
            - WEB_PORTAL
            - A2A_AGENT
            - DIRECT_MESSAGE
            - TELEGRAM
          default: WEB_PORTAL
          description: Origin channel of the intake request

    ClientIntakeResponse:
      type: object
      required:
        - id
        - clientType
        - clientName
        - clientEmail
        - wishlistPayload
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 101
        clientType:
          $ref: '#/components/schemas/ClientType'
        clientName:
          type: string
          example: "Alice Smith"
        clientEmail:
          type: string
          format: email
          example: "alice@example.com"
        companyName:
          type: string
          nullable: true
          example: "Acme Corp"
        wishlistPayload:
          type: string
          example: "We need a turnkey AI automated pipeline for client intake with encrypted storage."
        status:
          $ref: '#/components/schemas/IntakeStatus'
        agentMetadata:
          $ref: '#/components/schemas/AgentMetadata'
          nullable: true
        source:
          type: string
          example: "WEB_PORTAL"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-15T12:00:00Z"

    IntakePage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClientIntakeResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "clientEmail"
        message:
          type: string
          example: "must be a well-formed email address"

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Validation failed for intake request payload"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-15T12:00:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          nullable: true
