openapi: 3.0.3
info:
  title: Podcast API Contract
  description: Shared API specification for Dmitry Efremov's Podcast Media Hub. Defines media delivery endpoints for browsing and listening to podcast episodes.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/podcasts:
    get:
      summary: List podcast episodes
      description: Retrieves a paginated list of published podcast episodes, ordered by publication date descending.
      operationId: listPodcastEpisodes
      parameters:
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved episode list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastEpisodePage'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/podcasts/{slug}:
    get:
      summary: Get podcast episode by slug
      description: Retrieves detail of a single podcast episode including its timecodes and media URL.
      operationId: getPodcastEpisodeBySlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Unique URL identifier slug of the podcast episode
          schema:
            type: string
      responses:
        '200':
          description: Podcast episode found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastEpisode'
        '404':
          description: Podcast episode not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PodcastTimecode:
      type: object
      required:
        - id
        - timeOffsetSeconds
        - title
        - displayOrder
      properties:
        id:
          type: integer
          format: int64
          example: 1
        timeOffsetSeconds:
          type: integer
          description: Offset from the beginning of the episode in seconds
          example: 125
        title:
          type: string
          description: Title or label of the timecode segment
          example: "Introduction to Deontic Logic"
        description:
          type: string
          nullable: true
          description: Detailed description of the segment
          example: "Overview of deontic operators O (Obligatory), P (Permitted), and F (Forbidden)."
        displayOrder:
          type: integer
          description: Sequence order of the timecode in the episode
          example: 0

    PodcastEpisode:
      type: object
      required:
        - id
        - slug
        - title
        - audioUrl
        - timecodes
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 42
        slug:
          type: string
          description: Unique URL friendly identifier
          example: "systems-and-deontic-logic"
        title:
          type: string
          description: Title of the podcast episode
          example: "Systems, Logic, and Autonomous Processes"
        thesis:
          type: string
          nullable: true
          description: Core thesis or summary note of the episode
          example: "Your code and your decisions are who you truly are."
        description:
          type: string
          nullable: true
          description: Full description of the episode content
          example: "In this episode we explore deontic logic and Theory of Constraints."
        audioUrl:
          type: string
          format: uri
          description: Direct audio media stream URL for listening
          example: "https://media.dmitryefremov.site/podcasts/ep-42.mp3"
        mediaLink:
          type: string
          format: uri
          nullable: true
          description: External video/audio platform link (e.g. YouTube, Spotify)
          example: "https://youtube.com/watch?v=example"
        durationSeconds:
          type: integer
          nullable: true
          description: Total duration of the episode in seconds
          example: 3600
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the episode was published
          example: "2026-10-09T10:00:00Z"
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp
          example: "2026-10-09T11:58:13Z"
        timecodes:
          type: array
          description: Array of timecodes associated with this episode
          items:
            $ref: '#/components/schemas/PodcastTimecode'

    PodcastEpisodePage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PodcastEpisode'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: "Podcast episode with slug 'unknown-slug' was not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T12:00:00Z"
