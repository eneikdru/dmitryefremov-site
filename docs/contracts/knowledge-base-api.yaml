openapi: 3.0.3
info:
  title: Shared Knowledge Base & Concepts API Contract
  description: API specification for knowledge base concepts, tag hierarchies, and applied model configurations.
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/knowledge-base/concepts:
    get:
      summary: Fetch, search, and filter knowledge base concepts
      description: Retrieves a paginated list of concepts from the knowledge base, with optional filtering by category or tag, and keyword/semantic search.
      operationId: getConcepts
      parameters:
        - name: category
          in: query
          required: false
          description: Filter concepts by category (e.g., PHILOSOPHY, AUTONOMOUS_ENGINEERING, AGENTIC_ECONOMY, PRAGMATIC_BUSINESS_STRATEGY)
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Filter concepts by tag name
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Search term to match against concept title, description, or content
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page index (0-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved paginated concepts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptPage'
        '400':
          description: Invalid request query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create knowledge base concept
      description: Creates a new knowledge base concept with optional tags.
      operationId: createConcept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptCreateRequest'
      responses:
        '201':
          description: Concept successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptItem'
        '400':
          description: Invalid concept payload or duplicate slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge-base/concepts/{slug}:
    get:
      summary: Get knowledge base concept detail by slug
      description: Retrieves concept details including attached tags and applied model configurations.
      operationId: getConceptBySlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Unique URL identifier slug of the concept
          schema:
            type: string
      responses:
        '200':
          description: Concept details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptDetail'
        '404':
          description: Concept not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge-base/categories:
    get:
      summary: List all knowledge base concept categories
      description: Retrieves a list of all distinct category names used across concepts.
      operationId: getConceptCategories
      responses:
        '200':
          description: Successfully retrieved categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'

  /api/v1/knowledge-base/tags:
    get:
      summary: List all knowledge base concept tags
      description: Retrieves a list of all distinct tag names associated with concepts.
      operationId: getConceptTags
      responses:
        '200':
          description: Successfully retrieved tags list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'

  /api/v1/knowledge-base/concepts/{slug}/models:
    get:
      summary: List applied model configurations for a concept
      description: Retrieves all active and historical applied model configurations bound to a concept.
      operationId: getAppliedModelsForConcept
      parameters:
        - name: slug
          in: path
          required: true
          description: Concept slug
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved applied model configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppliedModelConfiguration'
        '404':
          description: Concept not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Attach an applied model configuration to a concept
      description: Creates and binds an applied model configuration to the specified concept.
      operationId: createAppliedModelForConcept
      parameters:
        - name: slug
          in: path
          required: true
          description: Concept slug
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppliedModelCreateRequest'
      responses:
        '201':
          description: Applied model configuration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedModelConfiguration'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concept not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ConceptItem:
      type: object
      required:
        - id
        - slug
        - title
        - category
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ConceptDetail:
      type: object
      required:
        - id
        - slug
        - title
        - category
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        appliedModels:
          type: array
          items:
            $ref: '#/components/schemas/AppliedModelConfiguration'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ConceptCreateRequest:
      type: object
      required:
        - slug
        - title
        - category
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 255
        title:
          type: string
          minLength: 1
          maxLength: 255
        category:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string

    ConceptPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConceptItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    AppliedModelConfiguration:
      type: object
      required:
        - id
        - modelName
        - version
        - configurationJson
        - isActive
      properties:
        id:
          type: integer
          format: int64
        conceptId:
          type: integer
          format: int64
          nullable: true
        conceptSlug:
          type: string
          nullable: true
        modelName:
          type: string
        version:
          type: string
        configurationJson:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    AppliedModelCreateRequest:
      type: object
      required:
        - modelName
        - configurationJson
      properties:
        modelName:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: string
          default: '1.0.0'
          maxLength: 50
        configurationJson:
          type: string
        isActive:
          type: boolean
          default: true

    CategoryList:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            type: string

    TagList:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
