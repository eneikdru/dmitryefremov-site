openapi: 3.0.3
info:
  title: Admin Dashboard & Telemetry API Contract
  description: Shared API specification for Dmitry Efremov's Admin Dashboard, telemetry ingestion, admin authentication, and GDPR data subject rights (data export and erasure).
  version: 1.0.0
servers:
  - url: /
    description: Current server environment

paths:
  /api/v1/telemetry:
    post:
      summary: Ingest telemetry event
      description: Ingests site telemetry, dwell time tracking metrics, or system event logs into the secure telemetry store.
      operationId: ingestTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '201':
          description: Telemetry event successfully recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryLog'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/auth/login:
    post:
      summary: Admin authentication login
      description: Authenticates admin user credentials and returns a bearer authorization token.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid admin credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/auth/me:
    get:
      summary: Get current authenticated admin user
      description: Retrieves profile details of the currently authenticated admin user.
      operationId: getAdminMe
      responses:
        '200':
          description: Successfully retrieved admin user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/auth/logout:
    post:
      summary: Admin authentication logout
      description: Invalidates current admin authorization token.
      operationId: adminLogout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out"

  /api/v1/admin/telemetry:
    get:
      summary: Query telemetry logs
      description: Retrieves paginated telemetry logs for admin dashboard inspection.
      operationId: listTelemetryLogs
      parameters:
        - name: eventType
          in: query
          description: Filter by event type
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successfully retrieved telemetry logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryLogPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/gdpr/export/{userId}:
    get:
      summary: GDPR Data Subject Export
      description: Exports all personal data associated with a specific user ID in compliance with GDPR Art. 15 (Right of access).
      operationId: exportUserData
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user ID for data subject export
          schema:
            type: string
      responses:
        '200':
          description: User data successfully exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User data not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/gdpr/erasure/{userId}:
    delete:
      summary: GDPR Data Subject Erasure
      description: Permanently erases or anonymizes all personal data associated with a specific user ID in compliance with GDPR Art. 17 (Right to be forgotten).
      operationId: eraseUserData
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user ID for data subject erasure
          schema:
            type: string
      responses:
        '200':
          description: User data successfully erased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User data not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/gdpr/consent/{userId}:
    get:
      summary: Get user consent records
      description: Retrieves consent records and privacy preferences for a given user ID.
      operationId: getConsentRecords
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
      responses:
        '200':
          description: Consent records retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "dmitry_admin"
        password:
          type: string
          format: password
          example: "SuperSecurePassphrase123!"

    AuthResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          example: 86400
        user:
          $ref: '#/components/schemas/AdminUserResponse'

    AdminUserResponse:
      type: object
      required:
        - id
        - username
        - email
        - role
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "dmitry_admin"
        email:
          type: string
          format: email
          example: "dmitry@efremov.com"
        role:
          type: string
          example: "ADMIN"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T12:36:26Z"

    TelemetryIngestRequest:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          example: "DWELL_TIME_TRACK"
        payload:
          type: string
          nullable: true
          example: "{\"page\":\"/articles/deontic-logic\",\"dwellTimeMs\":45000}"
        source:
          type: string
          nullable: true
          example: "web-client"

    TelemetryLog:
      type: object
      required:
        - id
        - eventType
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 101
        eventType:
          type: string
          example: "DWELL_TIME_TRACK"
        payload:
          type: string
          nullable: true
          example: "{\"page\":\"/articles/deontic-logic\",\"dwellTimeMs\":45000}"
        source:
          type: string
          nullable: true
          example: "web-client"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T13:00:00Z"

    TelemetryLogPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLog'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 105
        totalPages:
          type: integer
          example: 6

    ConsentRecord:
      type: object
      required:
        - id
        - userId
        - consentType
        - granted
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 5
        userId:
          type: string
          example: "user_anon_98231"
        consentType:
          type: string
          example: "ANALYTICS_COOKIES"
        granted:
          type: boolean
          example: true
        ipAddress:
          type: string
          nullable: true
          example: "192.0.2.1"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T12:00:00Z"

    DataExportResponse:
      type: object
      required:
        - userId
        - exportedAt
        - consentRecords
      properties:
        userId:
          type: string
          example: "user_anon_98231"
        exportedAt:
          type: string
          format: date-time
          example: "2026-10-15T13:10:00Z"
        consentRecords:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
        telemetryLogs:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLog'

    ErasureResponse:
      type: object
      required:
        - userId
        - erasedAt
        - recordsErased
        - status
      properties:
        userId:
          type: string
          example: "user_anon_98231"
        erasedAt:
          type: string
          format: date-time
          example: "2026-10-15T13:10:00Z"
        recordsErased:
          type: integer
          example: 12
        status:
          type: string
          example: "ERASED"

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid request parameters"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-15T13:00:00Z"
